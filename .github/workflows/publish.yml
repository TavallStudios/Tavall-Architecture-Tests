name: Publish locked Gradle artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version required by downstream dependency locks
        required: true
        default: "1.0.0"
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Tavall-Publish-Version:')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Resolve publish version
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${DISPATCH_VERSION:-}"
          if [[ -z "${version}" ]]; then
            version="$(git log -1 --format=%B | sed -n 's/^Tavall-Publish-Version:[[:space:]]*//p' | head -n 1)"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid or missing Tavall publish version: ${version}" >&2
            exit 64
          fi
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify and publish artifacts
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle --no-daemon --max-workers=1 -PtavallVersion="${{ steps.release.outputs.version }}" clean check publish
