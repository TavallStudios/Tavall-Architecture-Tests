name: Architecture Tests Source Integrity

on:
  pull_request:
    branches:
      - main
      - staging/architecture
  push:
    branches:
      - main
      - staging/architecture
      - working/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    name: source-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 .github/scripts/verify_ci_source_state.py \
            --root . \
            --expected-head "${GITHUB_SHA}"
          python3 .github/scripts/verify_ci_source_state.py --self-test
          echo "Gradle checks and artifact publication run through Tavall CI/local executors."
