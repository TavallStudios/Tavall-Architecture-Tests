name: Architecture Tests

on:
  pull_request:
    branches:
      - main
      - staging/architecture
  push:
    branches:
      - main
      - staging/architecture
      - working/**
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  architecture:
    name: architecture-combined
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Verify exact source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --porcelain=v1

      - name: Run repository verification contract
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/verify architecture-combined
